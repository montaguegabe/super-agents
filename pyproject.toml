[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "super-agents"
version = "0.1.0"
description = "MCP wrapper for controlling Codex app-server threads, turns, plan mode, and steering."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.4",
  "websockets>=12.0",
]

[project.urls]
Repository = "https://github.com/montaguegabe/super-agents"
Issues = "https://github.com/montaguegabe/super-agents/issues"

[project.scripts]
super-agents-mcp = "super_agents.mcp_server:main"
super-agents-claude-proxy = "super_agents.claude_proxy.server:main"
super-agents-claude-tui = "super_agents.claude_tui.cli:main"
super-agents-backend = "super_agents.claude_proxy.backend:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_agents"]

[tool.hatch.build.targets.wheel.force-include]
"claude-tui/src/super_agents/claude_tui" = "super_agents/claude_tui"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "claude-tui/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv]
exclude-newer = "10 days"
index-strategy = "first-index"

[tool.uv.pip]
exclude-newer = "10 days"
index-strategy = "first-index"
