[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "super-agents"
version = "0.1.11"
description = "MCP wrapper for controlling Codex app-server threads, turns, plan mode, and steering."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.4",
  "websockets>=12.0",
]

[project.urls]
Repository = "https://github.com/montaguegabe/super-agents"
Issues = "https://github.com/montaguegabe/super-agents/issues"

[project.scripts]
super-agents-mcp = "super_agents.mcp_server:main"
super-agents-backend = "super_agents.backend:main"
super-agents-open-pr-review-discover = "super_agents.open_pr_reviews:main"

[project.optional-dependencies]
# Needed when OPENBASE_CODING_BACKEND=claude_code is selected.
claude = [
  "claude-agent-sdk>=0.1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_agents"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv]
exclude-newer = "10 days"
index-strategy = "first-index"

[tool.uv.pip]
exclude-newer = "10 days"
index-strategy = "first-index"
